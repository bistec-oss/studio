name: Build and push Docker image

# Single image serves both the web app and the scheduler worker (the
# scheduler service just overrides CMD — see docker-compose.yml). Coolify
# pulls the same tag for both resources.
on:
  push:
    branches: [main]
  # Manual trigger — lets a redeploy be re-run without a new commit, and lets
  # AC-P0-1 (a deliberately invalid token) be exercised on demand.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Coolify base URL, used by the redeploy + verify steps below. Prod's own
  # public URL, polled post-deploy by the verify step.
  COOLIFY_URL: https://coolify.bistecglobal.com
  PROD_URL: https://studio.bistecglobal.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The image knows its own commit (FR-P0-3) — the Dockerfile runner
          # stage turns this into ENV GIT_SHA, read by /api/health at request time.
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trigger Coolify to pull the freshly-pushed :latest and redeploy both
      # resources that run this image. Requires the COOLIFY_API_TOKEN repo
      # secret (Coolify → Keys & Tokens → create an API token with deploy scope).
      #
      # One script step loops over both UUIDs so a failed app redeploy never
      # skips the scheduler one (FR-P0-2) — curl -sS -o/-w (not -f) so the
      # response body survives a non-2xx status, which is mapped to a readable
      # reason (FR-P0-1). The token is only ever read from $COOLIFY_API_TOKEN
      # (never interpolated into this script, never echoed). The job fails at
      # the end if either redeploy failed, reporting both outcomes.
      #
      # The scheduler has no HTTP surface of its own, so its deployment_uuid is
      # captured to $GITHUB_OUTPUT here for the post-deploy verify step (T4) to
      # poll the Coolify deployment status directly.
      - name: Redeploy on Coolify (app + scheduler, both always attempted)
        id: redeploy
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set -uo pipefail  # no -e: one failed redeploy must not abort the other

          status_to_reason() {
            case "$1" in
              401|403) echo "token rejected — rotate COOLIFY_API_TOKEN (docs/coolify-token-rotation.md)" ;;
              404) echo "resource UUID not found" ;;
              2*) echo "ok" ;;
              *) echo "unexpected response" ;;
            esac
          }

          # redeploy_one <name> <uuid> — deploys one resource, prints its status
          # + reason, and (on success) records the scheduler's deployment_uuid.
          redeploy_one() {
            local name="$1" uuid="$2" body_file status body reason
            body_file="$(mktemp)"
            status=$(curl -sS -o "$body_file" -w '%{http_code}' -X GET \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              "$COOLIFY_URL/api/v1/deploy?uuid=${uuid}&force=false")
            body=$(cat "$body_file")
            rm -f "$body_file"
            reason=$(status_to_reason "$status")

            if [[ "$status" == 2* ]]; then
              echo "$name redeploy: HTTP $status ($reason)"
              if [ "$name" = "scheduler" ]; then
                echo "scheduler_deployment_uuid=$(echo "$body" | jq -r '.deployments[0].deployment_uuid // empty')" >> "$GITHUB_OUTPUT"
              fi
              return 0
            fi

            echo "::error::$name redeploy failed: HTTP $status ($reason)"
            if [ "$reason" = "unexpected response" ]; then
              echo "::error::$name response body: $body"
            fi
            return 1
          }

          app_result=0
          redeploy_one app nck8s530pseqdcfxt50hndl5 || app_result=1
          scheduler_result=0
          redeploy_one scheduler warr96qhvzrie5ndwv8oteeu || scheduler_result=1

          echo "Redeploy summary: app=$([ "$app_result" = 0 ] && echo ok || echo failed), scheduler=$([ "$scheduler_result" = 0 ] && echo ok || echo failed)"

          if [ "$app_result" != 0 ] || [ "$scheduler_result" != 0 ]; then
            exit 1
          fi

      # The workflow verifies the deploy, not just that Coolify accepted the
      # trigger (FR-P0-5). Only runs once the redeploy step above has actually
      # succeeded — if it failed, the job is already red and there is nothing
      # new to poll for. Both checks below run regardless of each other's
      # outcome, and the job fails at the end reporting both (mirrors the
      # redeploy step's own always-both contract).
      #
      # App: poll /api/health until it reports this commit. Coolify pulls the
      # image, runs `prisma migrate deploy` in the entrypoint, then boots — the
      # ~10 min budget (40 x 15s) has to cover a migration.
      #
      # Scheduler: it has no HTTP surface, so instead poll its Coolify
      # deployment status (captured above as scheduler_deployment_uuid) until
      # it reports "finished". This proves the container deployed, not that the
      # worker loop runs — that is 006's heartbeat, and B4 (docs/handoff.md).
      - name: Verify deploy (prod /api/health + scheduler deployment status)
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set -uo pipefail  # no -e: the app check must still run even if the scheduler check fails, and vice versa

          app_verified=0
          last_commit="(none)"
          for i in $(seq 1 40); do
            resp=$(curl -sS --max-time 10 "$PROD_URL/api/health" 2>/dev/null || true)
            commit=$(echo "$resp" | jq -r '.commit // empty' 2>/dev/null || true)
            if [ -n "$commit" ]; then
              last_commit="$commit"
            fi
            if [ "$commit" = "${{ github.sha }}" ]; then
              echo "prod /api/health reports ${{ github.sha }} after $((i * 15))s"
              app_verified=1
              break
            fi
            sleep 15
          done
          if [ "$app_verified" != 1 ]; then
            echo "::error::prod /api/health never reported ${{ github.sha }} within 10 min — last commit seen: $last_commit"
          fi

          scheduler_verified=0
          deployment_uuid="${{ steps.redeploy.outputs.scheduler_deployment_uuid }}"
          if [ -z "$deployment_uuid" ]; then
            echo "::error::scheduler status unknown — the redeploy response had no deployment_uuid"
          else
            last_status="(none)"
            for i in $(seq 1 40); do
              last_status=$(curl -sS --max-time 10 \
                -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
                "$COOLIFY_URL/api/v1/deployments/${deployment_uuid}" 2>/dev/null \
                | jq -r '.status // empty' 2>/dev/null || true)
              case "$last_status" in
                finished)
                  echo "scheduler deployment finished after $((i * 15))s"
                  scheduler_verified=1
                  break
                  ;;
                failed | cancelled)
                  echo "::error::scheduler deployment $last_status"
                  break
                  ;;
                *) sleep 15 ;;
              esac
            done
            if [ "$scheduler_verified" != 1 ]; then
              echo "::error::scheduler deployment never reached 'finished' within 10 min — last status: ${last_status:-unknown}"
            fi
          fi

          if [ "$app_verified" != 1 ] || [ "$scheduler_verified" != 1 ]; then
            exit 1
          fi
