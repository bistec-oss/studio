name: Build and deploy

# Single image serves both the web app and the scheduler worker (the scheduler
# Deployment just overrides the command with `node dist/scheduler/worker.js`).
#
# Prod runs on the Bistec k3s cluster (namespace studio-uat), deployed by
# ArgoCD from the Platform-GitOps repo on Azure DevOps. This workflow does not
# talk to the cluster: it builds the image, then commits the new image tag to
# Platform-GitOps, and ArgoCD rolls it out. Coolify is retired.
on:
  push:
    branches: [main]
  # Manual trigger — lets a deploy be re-run without a new commit. Guarded to
  # main at the job level below — a dispatch on any other ref must never
  # reach prod.
  workflow_dispatch:

# Only one prod deploy runs at a time; a second merge while one is in flight
# queues behind it rather than racing it on the same GitOps file.
# cancel-in-progress: false — a deploy already underway must finish.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Prod's own public URL, polled post-deploy by the verify step.
  PROD_URL: https://studio.bistecglobal.com
  # Where ArgoCD reads Studio's image tag from. Both studio-web.image.tag and
  # studio-scheduler.image.tag live in this one file and must always match.
  GITOPS_REPO: dev.azure.com/BistecGlobal/Platform-GitOps/_git/Platform-GitOps
  GITOPS_VALUES: charts/studio-app/values-uat.yaml

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # workflow_dispatch can target any ref — without this guard a manual run on
    # a feature branch would still deploy that branch's image to prod.
    # push is already branch-filtered above; this makes both triggers agree.
    if: github.ref == 'refs/heads/main'
    # Build + a ~15-min verify poll comfortably fit; caps a hung step instead
    # of running to GitHub's default 6h.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The image knows its own commit (FR-P0-3) — the Dockerfile runner
          # stage turns this into ENV GIT_SHA, read by /api/health at request time.
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Point prod at the image just pushed. The cluster pins the immutable
      # sha-<full-sha> tag, never :latest, so what runs is always traceable to
      # a commit and a rollback is a revert of this commit in Platform-GitOps.
      #
      # Requires the PLATFORM_GITOPS_PAT repo secret: an Azure DevOps PAT in the
      # BistecGlobal org with Code (Read & Write) scope, owned by a service
      # identity that can push to Platform-GitOps main. The token is sent as an
      # HTTP header, never put in a clone URL, so it cannot end up in
      # .git/config or a log line.
      #
      # Idempotent: a re-run for a commit that is already deployed finds no
      # change and pushes nothing. A push that loses a race with another
      # pipeline's tag bump rebases and retries.
      - name: Deploy — bump image tag in Platform-GitOps
        env:
          GITOPS_PAT: ${{ secrets.PLATFORM_GITOPS_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GITOPS_PAT:-}" ]; then
            echo "::error::PLATFORM_GITOPS_PAT secret is not set — cannot deploy"
            exit 1
          fi
          AUTH="AUTHORIZATION: basic $(printf ':%s' "$GITOPS_PAT" | base64 -w0)"
          echo "::add-mask::$(printf ':%s' "$GITOPS_PAT" | base64 -w0)"
          TAG="sha-${GITHUB_SHA}"

          git -c http.extraheader="$AUTH" clone --quiet --depth 20 --branch main "https://${GITOPS_REPO}" gitops
          cd gitops
          git config user.name "Studio CI (GitHub Actions)"
          git config user.email "pipeline@bistecglobal.com"

          # Exactly two pinned tags in the file (web + scheduler). Anything
          # else means the file's shape changed and a blind edit could deploy
          # one tier without the other — stop instead.
          before=$(grep -cE '^    tag: sha-[0-9a-f]{40}$' "$GITOPS_VALUES" || true)
          if [ "$before" != "2" ]; then
            echo "::error::expected 2 pinned 'tag: sha-…' lines in $GITOPS_VALUES, found $before — refusing to edit"
            exit 1
          fi
          sed -E -i "s/^(    tag: )sha-[0-9a-f]{40}$/\1${TAG}/" "$GITOPS_VALUES"
          if [ "$(grep -cx "    tag: ${TAG}" "$GITOPS_VALUES")" != "2" ]; then
            echo "::error::tag bump did not land on both web and scheduler"
            exit 1
          fi

          if git diff --quiet; then
            echo "Platform-GitOps already at ${TAG} — nothing to deploy"
            exit 0
          fi
          git add "$GITOPS_VALUES"
          git commit --quiet -m "deploy(uat): studio image tag -> ${TAG} [skip ci]" \
            -m "From ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          for attempt in 1 2 3 4 5; do
            if git -c http.extraheader="$AUTH" push --quiet origin HEAD:main; then
              echo "Pushed ${TAG} to Platform-GitOps main (attempt $attempt)"
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing on latest main"
            sleep $((attempt * 5))
            git -c http.extraheader="$AUTH" pull --quiet --rebase origin main
          done
          echo "::error::could not push the tag bump to Platform-GitOps after 5 attempts"
          exit 1

      # The workflow verifies the deploy, not just that the tag was committed
      # (FR-P0-5): poll /api/health until it reports this commit. ArgoCD polls
      # git every ~3 min, then the pod pulls the image and runs
      # `prisma migrate deploy` in the entrypoint before booting — the ~15 min
      # budget (60 x 15s) covers all three.
      #
      # The scheduler has no HTTP surface and this workflow holds no cluster
      # credentials, so it is not verified here. It runs the same image from
      # the same values file, so the two cannot drift apart; whether it is
      # healthy is visible in ArgoCD (application studio-uat).
      - name: Verify deploy (prod /api/health)
        run: |
          set -uo pipefail
          last_commit="(none)"
          last_http="(none)"
          for i in $(seq 1 60); do
            body_file="$(mktemp)"
            http_code=$(curl -sS --max-time 10 -o "$body_file" -w '%{http_code}' "$PROD_URL/api/health" 2>/dev/null || true)
            resp=$(cat "$body_file" 2>/dev/null || true)
            rm -f "$body_file"
            last_http="$http_code"
            if [ "$http_code" = "200" ]; then
              commit=$(echo "$resp" | jq -r '.commit // empty' 2>/dev/null || true)
              [ -n "$commit" ] && last_commit="$commit"
              if [ "$commit" = "${GITHUB_SHA}" ]; then
                echo "prod /api/health reports ${GITHUB_SHA} after $((i * 15))s"
                exit 0
              fi
            fi
            sleep 15
          done
          echo "::error::prod /api/health never reported ${GITHUB_SHA} within 15 min — last commit seen: $last_commit (last HTTP: $last_http). Check ArgoCD application studio-uat."
          exit 1
